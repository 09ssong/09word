ample": "I cringe when I watch my old videos.", "note": "That's so cringe는 아주 비격식적. cringey/cringeworthy도 쓸 수 있어요."}, {"en": "for real / no cap", "ko": "진짜로 / 거짓말 아니고", "cat": "캐주얼", "situation": "정말 믿기 어려운 소식을 듣고 ‘진짜?’라고 해요.", "example": "For real? / That was amazing, no cap.", "note": "For real?은 ‘진짜?’. no cap은 보통 ‘거짓말 아니고’라고 강조하는 속어예요."}, {"en": "shady / suspicious / sketchy", "ko": "수상한 · 미심쩍은", "cat": "캐주얼", "situation": "처음 본 사이트에서 돈부터 보내라고 해요.", "example": "That website looks sketchy.", "note": "shady는 부정직한 느낌, sketchy는 수상하거나 안전하지 않은 느낌. 완전히 같은 뜻은 아니에요."}, {"en": "Chill out / relax / calm down", "ko": "진정해 · 긴장 풀어", "cat": "캐주얼", "situation": "친구가 작은 일로 너무 흥분했어요.", "example": "Take a breath and calm down.", "note": "calmdawn → calm down. Chill out은 비격식적이며 말투에 따라 무례하게 들릴 수 있어요."}, {"en": "no big deal / no problem", "ko": "별일 아니야 / 문제없어", "cat": "캐주얼", "situation": "친구가 작은 실수에 대해 미안하다고 해요.", "example": "It's no big deal.", "note": "no big deal은 대수롭지 않다는 뜻, no problem은 문제없다거나 부탁을 수락할 때 써요."}, {"en": "not for me / not my thing", "ko": "내 취향이 아니야", "cat": "캐주얼", "situation": "친구가 권한 취미가 내게는 별로예요.", "example": "Camping is not really my thing.", "note": "사람에 대한 이성적 취향은 not my type이 자연스러워요. NFM은 보편적인 약어로 외우지 않아도 돼요."}, {"en": "the ick", "ko": "갑자기 정떨어지는 느낌", "cat": "캐주얼", "situation": "호감 있던 사람의 행동을 보고 갑자기 마음이 식었어요.", "example": "That gave me the ick.", "note": "pet peeve와 달라요. 주로 호감이나 매력이 갑자기 사라질 때 쓰는 비격식 표현이에요."}, {"en": "pet peeve", "ko": "유독 거슬리는 행동 · 개인적인 짜증 포인트", "cat": "캐주얼", "situation": "누군가 입을 벌리고 씹는 소리가 유독 싫어요.", "example": "Loud chewing is my pet peeve.", "note": "the ick과 달리 평소 특히 거슬리는 것을 말해요."}, {"en": "easygoing", "ko": "느긋한 · 털털한", "cat": "감정", "situation": "친구는 작은 일에 화내지 않고 편안한 성격이에요.", "example": "She's very easygoing.", "note": "easy-going으로 쓰기도 해요."}, {"en": "put someone to bed", "ko": "누군가를 재우다 · 잠자리에 눕히다", "cat": "일상", "situation": "아이를 재우고 나서 영화를 볼 거예요.", "example": "I'll put the kids to bed first.", "note": "내가 잠자리에 드는 것은 go to bed. put to bed all ears.", "note": ""}, {"en": "out of the blue", "ko": "뜬금없이 · 느닷없이", "cat": "관용구", "situation": "몇 년간 연락 없던 친구가 갑자기 전화했어요.", "example": "She called me out of the blue.", "note": ""}, {"en": "once in a blue moon", "ko": "아주 가끔 · 극히 드물게", "cat": "관용구", "situation": "나는 노래방에 정말 드물게 가요.", "example": "I go to karaoke once in a blue moon.", "note": ""}, {"en": "the last straw", "ko": "인내심의 한계를 넘긴 마지막 일", "cat": "관용구", "situation": "계속 참았는데 또 약속을 어겨 더는 못 참겠어요.", "example": "That was the last straw.", "note": "단순한 결정타보다 ‘더 이상 참을 수 없게 만든 마지막 일’에 가까워요."}, {"en": "unpleasant", "ko": "불쾌한 · 기분 나쁜", "cat": "감정", "situation": "방 안에서 불쾌한 냄새가 나요.", "example": "There's an unpleasant smell in here.", "note": ""}, {"en": "Shame on you!", "ko": "부끄러운 줄 알아!", "cat": "캐주얼", "situation": "친구를 괴롭힌 사람을 강하게 나무라요.", "example": "Shame on you for treating her like that!", "note": "상대를 강하게 비난하는 말이에요."}, {"en": "I don't buy it.", "ko": "난 안 믿어. · 납득이 안 돼.", "cat": "관용구", "situation": "상대의 변명이 영 믿기지 않아요.", "example": "That's your excuse? I don't buy it.", "note": ""}, {"en": "BS / bullshit", "ko": "헛소리 · 말도 안 되는 소리", "cat": "캐주얼", "situation": "누군가 터무니없는 주장을 해요.", "example": "That's BS.", "note": "욕설이에요. 격식 있는 자리에서는 피하고 That's nonsense.로 바꿀 수 있어요."}, {"en": "wherever", "ko": "어디든 · 어디에 ~하든", "cat": "일상", "situation": "친구에게 원하는 곳 어디든 가도 된다고 해요.", "example": "We can go wherever you want.", "note": ""}, {"en": "work overtime", "ko": "초과 근무하다 · 야근하다", "cat": "일상", "situation": "일이 많아서 오늘 늦게까지 일해야 해요.", "example": "I have to work overtime tonight.", "note": "동작은 work overtime. overtime 자체가 꼭 밤 근무만 뜻하는 건 아니에요."}, {"en": "spicy", "ko": "매운 · 자극적인", "cat": "일상", "situation": "음식이 얼마나 매운지 물어보세요.", "example": "Is this dish spicy?", "note": "기본 뜻은 ‘매운’. 문맥에 따라 자극적이거나 도발적인 느낌도 있어요."}, {"en": "feel proud", "ko": "뿌듯하다 · 자랑스럽다", "cat": "감정", "situation": "어려운 일을 해내서 스스로가 뿌듯해요.", "example": "I feel proud of myself.", "note": ""}, {"en": "these days", "ko": "요즘", "cat": "일상", "situation": "요즘 영어 공부를 하고 있다고 말해요.", "example": "I'm studying English these days.", "note": ""}, {"en": "scream", "ko": "비명 · 비명을 지르다", "cat": "일상", "situation": "갑자기 큰 비명이 들렸어요.", "example": "I heard a scream.", "note": ""}, {"en": "overwhelming", "ko": "압도적인 · 감당하기 벅찬", "cat": "감정", "situation": "한꺼번에 받은 정보의 양이 너무 벅차요.", "example": "The amount of information is overwhelming.", "note": "I'm overwhelmed는 내가 느끼는 감정. It's overwhelming은 그렇게 느끼게 하는 대상이에요."}, {"en": "funeral", "ko": "장례식", "cat": "일상", "situation": "친구가 장례식에 참석했다고 말해요.", "example": "I attended a funeral yesterday.", "note": ""}];
const $=id=>document.getElementById(id);
let category='전체', mode='meaning', position=0, deck=[...data], listOpen=false, toastTimer;
const cats=['전체','일상','감정','캐주얼','관용구'];
function stopSpeech(){if('speechSynthesis' in window) window.speechSynthesis.cancel();}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);}
function speak(text){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('이 브라우저에서는 음성 듣기를 지원하지 않아요.');return;}try{stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('음성을 재생할 수 없어요. 기기 음성 설정을 확인해 주세요.');};window.speechSynthesis.speak(u);}catch(e){toast('이 기기에서는 음성을 재생할 수 없어요.');}}
function render(){stopSpeech();const card=deck[position];$('badge').textContent=card.cat;$('index').textContent=String(position+1).padStart(2,'0')+' / '+deck.length;$('eyebrow').textContent=mode==='meaning'?'이 뜻, 영어로 어떻게 말할까요?':'이 상황이라면, 뭐라고 말할까요?';$('question').textContent=mode==='meaning'?card.ko:card.situation;$('question').className='question'+(mode==='situation'?' scene':'');$('english').textContent=card.en;$('meaning').textContent=card.ko;$('example').textContent=card.example;$('note').textContent=card.note;$('note').hidden=!card.note;$('answer').hidden=true;$('reveal').textContent='정답 확인하기 ↗';$('reveal').setAttribute('aria-expanded','false');$('prev').disabled=position===0;$('next').textContent=position===deck.length-1?'처음부터 다시 →':'다음 표현 →';$('progress').style.width=((position+1)/deck.length*100)+'%';}
function chooseCategory(cat){category=cat;deck=data.filter(d=>cat==='전체'||d.cat===cat);position=0;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===cat)));render();renderList();}
cats.forEach(cat=>{const b=document.createElement('button');b.textContent=cat;b.dataset.cat=cat;b.setAttribute('aria-pressed',String(cat==='전체'));b.onclick=()=>chooseCategory(cat);document.querySelector('.categories').appendChild(b);});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));if(listOpen)toggleList();render();});
$('reveal').onclick=()=>{const show=$('answer').hidden;$('answer').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=show?'정답 가리기 ↑':'정답 확인하기 ↗';};
$('next').onclick=()=>{position=(position+1)%deck.length;render();};$('prev').onclick=()=>{if(position>0){position--;render();}};
$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}position=0;render();toast('표현 순서를 섞었어요.');};
$('listen').onclick=()=>speak(deck[position].example);
function toggleList(){listOpen=!listOpen;stopSpeech();$('study').hidden=listOpen;$('wordlist').hidden=!listOpen;$('listToggle').textContent=listOpen?'학습으로 돌아가기 ↗':'단어장 보기 ↗';if(listOpen)renderList();}
$('listToggle').onclick=toggleList;
function renderList(){const query=$('search').value.trim().toLowerCase();const results=data.filter(d=>(category==='전체'||d.cat===category)&&[d.en,d.ko,d.note].some(s=>s.toLowerCase().includes(query)));$('entries').replaceChildren();$('count').textContent=results.length+'개 표현';$('empty').hidden=results.length>0;results.forEach(d=>{const el=document.createElement('details');const summary=document.createElement('summary');const term=document.createElement('span');term.className='term';const en=document.createElement('span');en.lang='en';en.textContent=d.en;const ko=document.createElement('span');ko.className='gloss';ko.textContent=d.ko;term.append(en,ko);const plus=document.createElement('span');plus.className='plus';plus.textContent='+';plus.setAttribute('aria-hidden','true');summary.append(term,plus);const content=document.createElement('div');content.className='detail';const label=document.createElement('span');label.className='situationlabel';label.textContent='이 상황에서 말해 보세요';const scene=document.createElement('p');scene.className='situationtext';scene.textContent=d.situation;const example=document.createElement('div');example.className='example';const p=document.createElement('p');p.lang='en';p.textContent=d.example;const play=document.createElement('button');play.className='listen';play.textContent='◖)) 예문 듣기';play.onclick=()=>speak(d.example);example.append(p,play);content.append(label,scene,example);if(d.note){const note=document.createElement('p');note.className='note';note.textContent=d.note;content.append(note);}el.append(summary,content);$('entries').append(el);});}
$('search').oninput=renderList;
$('total').textContent=data.length+' EXPRESSIONS · EN / KR';
window.addEventListener('pagehide',stopSpeech);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
render();
</script></body></html>
